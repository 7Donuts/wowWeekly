name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No dependencies, so nothing to install. The suite covers the storage
      # and merge logic, which is the part where a mistake silently corrupts
      # somebody's week rather than showing up on screen.
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      # Migrations before the deploy, and additive by construction, so the
      # currently-live worker keeps working against the new schema for the
      # seconds between the two steps. A no-op until the D1 binding in
      # wrangler.jsonc is uncommented.
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: d1 migrations apply azeroth-agenda --remote

      - name: Deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
