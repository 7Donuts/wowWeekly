<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Azeroth Agenda: Changelog</title>
<link rel="stylesheet" href="midnight.css?v=1.10.0">
</head>
<body>
<div class="page">

  <div class="page-head">
    <div class="brand-sigil"><i class="ph-fill ph-scroll"></i></div>
    <div class="page-head-text">
      <div class="page-eyebrow">The Azeroth Agenda</div>
      <div class="page-title">Change<span>log</span></div>
      <div class="page-sub">Every update, fix and addition, newest first.</div>
    </div>
    <div class="page-nav">
      <a href="index.html" class="btn"><i class="ph ph-arrow-left"></i>The agenda</a>
      <button class="btn btn-icon" id="btn-theme" onclick="toggleTheme()" title="Toggle dark / light mode"><i class="ph ph-sun"></i></button>
    </div>
  </div>

  <div id="changelog"></div>

  <div class="page-foot">
    The Azeroth Agenda · Curated by Seven · Patch 12.0.5 · May 2026
  </div>
</div>

<script src="js/data-changelog.js?v=1.10.0"></script>
<script src="js/theme.js?v=1.10.0"></script>
<script>updateThemeBtn();</script>

<script>
function toggleVersion(idx) {
  const body = document.getElementById('cl-body-' + idx);
  const hdr  = document.getElementById('cl-hdr-' + idx);
  const chev = document.getElementById('cl-chev-' + idx);
  const isHidden = body.classList.contains('hidden');
  body.classList.toggle('hidden', !isHidden);
  hdr.classList.toggle('open', isHidden);
  chev.style.transform = isHidden ? 'rotate(0deg)' : 'rotate(-90deg)';
}

const BADGE = {
  new:     ['badge-new',     'New'],
  fix:     ['badge-fix',     'Fix'],
  improve: ['badge-improve', 'Improved'],
  content: ['badge-content', 'Content'],
  remove:  ['badge-fix',     'Removed'],
};

function render() {
  const container = document.getElementById('changelog');
  container.innerHTML = VERSIONS.map((v, i) => {
    const open = i === 0;
    return `
      <div class="cl-version">
        <div class="cl-version-header${open?' open':''}" id="cl-hdr-${i}" onclick="toggleVersion(${i})">
          <div class="section-icon"><i class="ph ph-scroll"></i></div>
          <div>
            <div class="cl-version-tag">${v.version}</div>
            <div class="cl-version-date">${v.date}</div>
          </div>
          <div class="cl-version-summary" style="color:var(--text-muted);">${v.summary}</div>
          <span class="chevron" id="cl-chev-${i}" style="transform:rotate(${open?'0':'-90'}deg);margin-left:0.5rem;"><i class="ph ph-caret-down"></i></span>
        </div>
        <div class="cl-body${open?'':' hidden'}" id="cl-body-${i}">
          ${v.entries.map(e => {
            const [cls, label] = BADGE[e.type] || ['badge-new','New'];
            return `
            <div class="cl-entry">
              <span class="cl-badge ${cls}">${label}</span>
              <div class="cl-text">
                ${e.text}
                ${e.detail ? `<span>${e.detail}</span>` : ''}
              </div>
            </div>`;
          }).join('')}
        </div>
      </div>`;
  }).join('');
}

render();
</script>
</body>
</html>
